{% extends "base.html" %}
{% block title %}Turnier erstellen{% endblock %}
{% block content %}
<section class="card form-card wide">
    <h1>Turnier erstellen</h1>

    <form method="POST" class="form-grid preserve-scroll-form">
        <label for="group_size">Gruppengröße</label>
        <select id="group_size" name="group_size" required>
            <option value="2">2 Spieler</option>
            <option value="3">3 Spieler</option>
            <option value="4" selected>4 Spieler</option>
            <option value="5">5 Spieler</option>
            <option value="6">6 Spieler</option>
            <option value="7">7 Spieler</option>
            <option value="8">8 Spieler</option>
        </select>

        <div class="discipline-settings-grid">
            <div class="discipline-settings-card">
                <label><input type="checkbox" name="billiard"> Billard</label>
                <label>Zielwert</label>
                <input type="number" name="billiard_target" value="8" min="1">
                <label>Sätze</label>
                <select name="billiard_sets"><option value="1">1</option><option value="3">3</option><option value="5">5</option></select>
            </div>

            <div class="discipline-settings-card">
                <label><input type="checkbox" name="dart"> Dart</label>
                <label>Startwert</label>
                <input type="number" name="dart_target" value="501" min="101">
                <label>Legs/Sätze</label>
                <select name="dart_sets"><option value="1">1</option><option value="3">3</option><option value="5">5</option></select>
            </div>

            <div class="discipline-settings-card">
                <label><input type="checkbox" name="kicker"> Kicker</label>
                <label>Zielwert</label>
                <input type="number" name="kicker_target" value="10" min="1">
                <label>Sätze</label>
                <select name="kicker_sets"><option value="1">1</option><option value="3">3</option><option value="5">5</option></select>
            </div>

            <div class="discipline-settings-card">
                <label><input type="checkbox" name="table_tennis"> Tischtennis</label>
                <label>Zielwert</label>
                <input type="number" name="table_tennis_target" value="11" min="1">
                <label>Sätze</label>
                <select name="table_tennis_sets"><option value="1">1</option><option value="3">3</option><option value="5">5</option></select>
            </div>

            <div class="discipline-settings-card">
                <label><input type="checkbox" name="cornhole"> Cornhole</label>
                <label>Zielwert</label>
                <input type="number" name="cornhole_target" value="21" min="1">
                <label>Sätze</label>
                <select name="cornhole_sets"><option value="1">1</option><option value="3">3</option><option value="5">5</option></select>
            </div>

            <div class="discipline-settings-card">
                <label><input type="checkbox" name="archery"> Bogenschießen</label>
                <label>Max pro Satz</label>
                <input type="number" value="30" disabled>
                <label>Sätze</label>
                <select name="archery_sets"><option value="1">1</option><option value="3">3</option><option value="5">5</option></select>
            </div>
        </div>

        <button class="button primary" type="submit">Turnier erstellen</button>
    </form>
</section>
{% endblock %}
